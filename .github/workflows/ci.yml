name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install pytest ruff
      - run: make lint
      - run: make test
      - run: make test-js
      - run: make dist
  cai-vao-desktiny:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        desktiny: [v3.1.0] # bản tối thiểu pack yêu cầu; thêm bản mới vào đây khi nâng
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Dking2007/DXOS_Desktiny
          ref: ${{ matrix.desktiny }}
          path: desktiny
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get install -y --no-install-recommends libpq5 # psycopg của Desktiny cần libpq
      - name: Cài phụ thuộc kiểm thử của Desktiny
        working-directory: desktiny
        run: pip install -r requirements-dev.txt
      - name: Cài mọi gói và plugin vào Desktiny rồi chạy luồng
        run: DESKTINY_DIR="$GITHUB_WORKSPACE/desktiny" PYTHONPATH=lib python -m pytest -q tests/desktiny
