<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sổ văn bản đến</title>
    <link rel="stylesheet" href="chung.css" />
  </head>
  <body>
    <div id="out" class="muted">Đang tải…</div>
    <script type="module">
      import { $, desktiny, h, server } from './mo-rong.js'
      import { badge, day } from './so-den.js'
      const context = await desktiny.context
      try {
        const { entry } = await server(`/api/van-ban/${context.record.case_id}`)
        $('#out').className = ''
        $('#out').replaceChildren(...(entry
          ? [h('div', { class: 'row' }, h('span', { class: 'big' }, `Số đến ${entry.number}`), badge(entry)),
             h('div', { class: 'muted' }, `Ngày đến ${day(entry.received_at)} · vào sổ: ${entry.registered_by}`),
             h('div', {}, entry.due ? `Hạn xử lý: ${day(entry.due)}` : 'Chưa đặt hạn xử lý.')]
          : [h('strong', {}, 'Chưa vào sổ văn bản đến.'), h('p', { class: 'muted' }, 'Bấm “Vào sổ văn bản đến” ở thanh thao tác để lấy số đến.')]))
      } catch (error) {
        $('#out').replaceChildren(h('span', { class: 'bad' }, error.message))
      }
    </script>
  </body>
</html>
