<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vào sổ văn bản đến</title>
    <link rel="stylesheet" href="chung.css" />
  </head>
  <body>
    <div id="detail" class="card muted">Đang tải…</div>
    <p class="muted">Số đến chạy liên tục trong năm. Mỗi văn bản chỉ được một số đến; bấm lại trả về đúng số đã cấp. Số đến và ngày đến được ghi vào văn bản.</p>
    <div class="row"><button id="register" type="button" disabled>Vào sổ</button> <button type="button" class="secondary" id="close">Đóng</button></div>
    <p id="status" aria-live="polite"></p>
    <script type="module">
      import { $, desktiny, h, server, show } from './mo-rong.js'
      import { day } from './so-den.js'
      const context = await desktiny.context
      const caseId = context.record.case_id
      $('#close').addEventListener('click', () => desktiny.close(null))
      const line = (label, value) => h('div', {}, h('span', { class: 'muted' }, `${label}: `), value || h('em', { class: 'bad' }, 'chưa có'))
      try {
        const data = await server(`/api/van-ban/${caseId}`)
        const d = data.draft
        $('#detail').className = 'card'
        $('#detail').replaceChildren(line('Nơi gửi', d.noi_gui), line('Số, ký hiệu', d.so_ky_hieu_goc), line('Trích yếu', d.trich_yeu),
          line('Mức độ khẩn', d.do_khan), line('Hạn xử lý', d.han_xu_ly ? day(d.han_xu_ly) : 'chưa đặt'))
        if (data.entry) {
          show($('#status'), `Văn bản đã có số đến ${data.entry.number} (ngày ${day(data.entry.received_at)}).`, 'ok')
          $('#register').textContent = 'Ghi lại số đến vào văn bản'
        }
        $('#register').disabled = !d.noi_gui || !d.trich_yeu
        if ($('#register').disabled) show($('#status'), 'Điền “Cơ quan, tổ chức gửi” và “Trích yếu nội dung” trong văn bản trước khi vào sổ.', 'bad')
      } catch (error) {
        show($('#status'), error.message, 'bad')
      }
      $('#register').addEventListener('click', async () => {
        $('#register').disabled = true
        try {
          const result = await server(`/api/van-ban/${caseId}/vao-so`, { method: 'POST' })
          desktiny.toast(`Số đến: ${result.entry.number}`)
          desktiny.refresh()
          desktiny.close({ so_den: result.entry.number })
        } catch (error) {
          show($('#status'), error.message, 'bad')
          $('#register').disabled = false
        }
      })
    </script>
  </body>
</html>
