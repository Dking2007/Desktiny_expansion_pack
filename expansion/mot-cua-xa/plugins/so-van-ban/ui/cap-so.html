<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cấp số văn bản</title>
    <link rel="stylesheet" href="chung.css" />
    <link rel="stylesheet" href="giao-dien.css" />
    <link rel="stylesheet" href="so-van-ban.css" />
    <style>
      body {
        padding-top: 14px;
      }
      .cs-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
        gap: 22px;
        align-items: start;
      }
      .cs-side {
        display: grid;
        gap: 14px;
      }
      .cs-side h1 {
        margin: 0;
        font-size: 18px;
      }
      .cs-side legend,
      .cs-label {
        margin-bottom: 6px;
        padding: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .cs-side textarea {
        width: 100%;
        font-weight: 400;
      }
      .cs-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .cs-choice-no {
        font-size: 15px;
      }
      .sv-choice.is-locked {
        cursor: default;
        opacity: 0.7;
      }
      .cs-done {
        display: grid;
        gap: 8px;
      }
      .cs-done p {
        margin: 0;
      }
      .cs-preview .gd-doc {
        min-height: 300px;
      }
      .cs-preview .gd-doc-summary {
        white-space: pre-line;
      }
      .cs-preview figcaption {
        margin-top: 8px;
        color: var(--gd-muted);
        font-size: 12.5px;
        text-align: center;
      }
      @media (max-width: 680px) {
        .cs-layout {
          grid-template-columns: 1fr;
        }
        .cs-preview .gd-doc {
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="cs-layout">
      <div class="cs-side" id="side" aria-live="polite">
        <h1>Cấp số văn bản</h1>
        <div id="body"></div>
      </div>
      <figure class="cs-preview" style="margin: 0">
        <div id="sheet"></div>
        <figcaption id="caption">Bản xem trước phần đầu văn bản</figcaption>
      </figure>
    </div>
    <script type="module">
      import { $, desktiny, h, server } from './mo-rong.js'
      import { icon, skeleton } from './bieu-do.js'
      import { dayOf, docSheet, numberMark, stamp, timeOf, today } from './van-ban.js'

      const context = await desktiny.context
      const caseId = context.record.case_id
      let data
      let summary
      const fail = (error, where = $('#body')) => where.replaceChildren(h('p', { class: 'gd-note tone-bad', role: 'alert' }, icon('alert', 15), error.message))

      // What a register would give this dossier: its own number when it already has one there, else the next one.
      const own = (code) => data.entries.find((e) => e.book === code)
      const chosen = () => data.books.find((b) => b.code === $('input[name=so]:checked')?.value)

      function preview(entry) {
        const book = chosen()
        if (!book) return $('#sheet').replaceChildren()
        const mine = entry || own(book.code)
        const number = mine ? mine.full_number : h('span', { class: 'sv-pending', title: 'Số dự kiến' }, book.next_full_number)
        const sheet = docSheet({ agency: data.agency, number, date: mine ? mine.issued_at : today(), kind: book.name, summary: summary?.value.trim() || data.case.title,
          label: mine ? `${book.name} số ${mine.full_number}` : `Bản xem trước: ${book.name}, số dự kiến ${book.next_full_number}` })
        $('#sheet').replaceChildren(sheet)
        $('#caption').textContent = mine
          ? `Hồ sơ đã có số này trong sổ ${book.name.toLocaleLowerCase('vi')}.`
          : 'Bản xem trước. Số dự kiến có thể lớn hơn nếu có người cấp số cùng lúc.'
        return sheet
      }

      function form() {
        summary = h('textarea', { id: 'summary', rows: 3, maxlength: 500 })
        summary.value = data.case.title
        summary.addEventListener('input', () => preview())
        const choices = data.books.map((book, index) => {
          const mine = own(book.code)
          const cancelled = mine?.state === 'cancelled'
          return h('label', { class: `sv-choice${cancelled ? ' is-locked' : ''}` },
            h('input', { type: 'radio', name: 'so', value: book.code, checked: index === 0 ? true : null, disabled: cancelled ? true : null, onchange: () => { preview(); button() } }),
            h('span', {}, h('strong', {}, book.name),
              h('small', {}, cancelled ? 'Số của hồ sơ trong sổ này đã huỷ; không cấp lại.' : mine ? `Hồ sơ đã có số, cấp ngày ${dayOf(mine.issued_at)}` : 'Số tiếp theo của sổ')),
            h('span', { class: 'cs-choice-no' }, numberMark(mine ? mine.full_number : book.next_full_number, { cancelled })))
        })
        const first = choices.find((c) => !c.querySelector('input').disabled)
        if (first) first.querySelector('input').checked = true
        const submit = h('button', { type: 'submit', id: 'go' }, 'Cấp số')
        $('#body').replaceChildren(h('form', { id: 'form', style: 'display:grid;gap:14px' },
          h('fieldset', { class: 'sv-choices' }, h('legend', {}, 'Sổ'), choices),
          h('label', { style: 'display:grid;gap:6px' }, h('span', { class: 'cs-label', style: 'margin:0' }, 'Trích yếu'), summary),
          h('p', { class: 'gd-sub', style: 'margin:0' }, 'Mỗi hồ sơ được một số trong mỗi sổ. Biểu mẫu có trường số và ngày văn bản thì số được ghi luôn vào hồ sơ.'),
          h('div', { class: 'cs-actions' }, submit, h('button', { type: 'button', class: 'gd-ghost', onclick: () => desktiny.close(null) }, 'Đóng')),
          h('p', { id: 'status', role: 'status', style: 'margin:0' })))
        $('#form').addEventListener('submit', issue)
        button()
        preview()
      }

      function button() {
        const book = chosen()
        $('#go').disabled = !book
        $('#go').textContent = book && own(book.code) ? 'Lấy số đã cấp' : 'Cấp số'
      }

      async function issue(event) {
        event.preventDefault()
        const book = chosen()
        if (!book) return
        const had = own(book.code)
        if (!had && !(await desktiny.confirm(`Cấp số ${book.next_full_number} trong sổ ${book.name.toLocaleLowerCase('vi')}? Số đã cấp không lấy lại được; cấp nhầm thì chỉ huỷ được.`))) return
        $('#go').disabled = true
        $('#go').textContent = 'Đang cấp số…'
        try {
          const result = await server(`/api/ho-so/${caseId}/cap-so`, { method: 'POST', body: { so: book.code, trich_yeu: summary.value } })
          desktiny.refresh()
          done(book, result, Boolean(had))
        } catch (error) {
          $('#status').replaceChildren(h('span', { class: 'gd-note tone-bad', role: 'alert' }, icon('alert', 15), error.message))
          button()
        }
      }

      function done(book, result, had) {
        const entry = result.entry
        if (!data.entries.some((e) => e.id === entry.id)) data.entries.push(entry)
        const sheet = preview(entry)
        stamp(sheet, had ? 'Đã có số' : 'Đã cấp số', dayOf(entry.issued_at))
        $('#caption').textContent = had ? `Số này đã cấp cho hồ sơ từ trước; không cấp số mới.` : `Đã vào sổ ${book.name.toLocaleLowerCase('vi')} lúc ${timeOf(entry.issued_at)}.`
        const wrote = result.written.includes('so_van_ban')
        $('#body').replaceChildren(h('div', { class: 'cs-done' },
          h('span', { class: 'gd-sub' }, had ? 'Số đã cấp trước đây cho hồ sơ này' : `Số mới của sổ ${book.name.toLocaleLowerCase('vi')}`),
          numberMark(entry.full_number, { big: true }),
          h('p', { class: 'gd-sub' }, `Ngày ${dayOf(entry.issued_at)} lúc ${timeOf(entry.issued_at)}, ${entry.issued_by}`),
          h('p', { class: `gd-note ${wrote ? 'tone-ok' : ''}` }, icon(wrote ? 'check' : 'file', 15),
            wrote ? 'Đã ghi số và ngày văn bản vào hồ sơ.' : 'Biểu mẫu của hồ sơ không có trường số văn bản; hãy ghi số này lên văn bản.'),
          h('div', { class: 'cs-actions', style: 'margin-top:6px' }, h('button', { type: 'button', onclick: () => desktiny.close({ so_van_ban: entry.full_number }) }, 'Xong'))))
        $('#body').querySelector('button').focus()
        desktiny.toast(`Số văn bản: ${entry.full_number}`)
      }

      $('#body').replaceChildren(skeleton(4, 16))
      try {
        data = await server(`/api/ho-so/${caseId}`)
        if (!data.books.length) $('#body').replaceChildren(h('p', { class: 'gd-note' }, 'Chưa có sổ văn bản nào. Nhờ quản trị khai sổ ở trang cấu hình.'))
        else form()
      } catch (error) {
        fail(error)
      }
    </script>
  </body>
</html>
