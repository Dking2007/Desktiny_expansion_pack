<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ký số</title>
    <link rel="stylesheet" href="chung.css" />
    <link rel="stylesheet" href="giao-dien.css" />
    <link rel="stylesheet" href="ky-so.css" />
    <style>
      body {
        padding-top: 14px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 18px;
      }
      .ky-step {
        display: grid;
        gap: 14px;
        margin-top: 16px;
      }
      .ky-step p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>Ký số văn bản</h1>
    <ol class="ks-steps" id="steps" aria-label="Các bước ký">
      <li>Chọn tài liệu</li>
      <li>Nhập PIN</li>
      <li>Đã ký</li>
    </ol>
    <div id="setup"></div>
    <div id="paper"></div>
    <div id="step" aria-live="polite"></div>

    <script type="module">
      import { $, desktiny, h, server } from './mo-rong.js'
      import { icon, skeleton } from './bieu-do.js'
      import { dayOf, fileList, grouped, pinBox, pinField, sheet, stamp, ticked, timeOf } from './pin.js'

      const context = await desktiny.context
      const caseId = context.record.case_id
      let me = null
      let data = null
      let files = null
      let paper = null

      function at(step) {
        $('#steps').querySelectorAll('li').forEach((li, index) => {
          li.classList.toggle('is-done', index < step)
          if (index === step) li.setAttribute('aria-current', 'step')
          else li.removeAttribute('aria-current')
        })
      }

      function choose() {
        at(0)
        const next = h('button', { type: 'button' }, 'Tiếp tục')
        const count = () => { const n = ticked(files).length; next.disabled = !n; next.textContent = n ? `Tiếp tục với ${n} tệp` : 'Chọn ít nhất một tệp' }
        files.onchange = count
        files.querySelectorAll('input').forEach((input) => (input.disabled = false))
        next.addEventListener('click', confirmPin)
        $('#step').replaceChildren(h('div', { class: 'ky-step' },
          h('p', { class: 'gd-sub' }, 'Đánh dấu tài liệu cần ký. Sau khi ký, phiếu xác nhận ký số (PDF) có mã xác thực được gắn vào hồ sơ.'),
          h('div', { class: 'ks-actions' }, next, h('button', { type: 'button', class: 'gd-ghost', onclick: () => desktiny.close(null) }, 'Đóng'))))
        count()
      }

      function confirmPin() {
        at(1)
        const ids = ticked(files)
        files.querySelectorAll('input').forEach((input) => (input.disabled = true))
        const pin = pinField('Mã PIN ký của bạn')
        const status = h('p', { role: 'status' })
        const sign = h('button', { type: 'submit' }, icon('check', 16), `Ký số ${ids.length} tệp`)
        const form = h('form', { class: 'ky-step' },
          h('p', {}, `Bạn ký với tên ${me.user.display_name}. Nhập PIN để xác nhận.`),
          pin.wrap,
          h('div', { class: 'ks-actions' }, sign, h('button', { type: 'button', class: 'gd-ghost', onclick: choose }, 'Quay lại')),
          status)
        form.addEventListener('submit', async (event) => {
          event.preventDefault()
          if (!pin.input.value) return pin.input.focus()
          sign.disabled = true
          try {
            const result = await server(`/api/ho-so/${caseId}/ky`, { method: 'POST', body: { pin: pin.input.value, file_ids: ids } })
            desktiny.refresh()
            done(result)
          } catch (error) {
            pin.input.value = ''
            sign.disabled = false
            status.replaceChildren(h('span', { class: 'gd-note tone-bad', role: 'alert' }, icon('alert', 15), error.message))
            pin.input.focus()
          }
        })
        $('#step').replaceChildren(form)
        pin.input.focus()
      }

      function done(result) {
        at(2)
        $('#steps').querySelectorAll('li')[2].classList.add('is-done')
        // The sheet now shows what was signed this time, then the stamp lands on it.
        paper.querySelector('.ks-files').replaceWith(h('ul', { class: 'ks-files', 'aria-label': 'Tài liệu vừa ký' },
          (result.files || []).map((f) => h('li', {}, h('div', {}, icon('check', 17), h('span'), h('span', { class: 'ks-file-name' }, f.name, h('small', {}, `Vừa ký, mã ${grouped(f.code)}`)))))))
        paper.querySelector('.ks-sheet-top span:last-child').textContent = `Ký lúc ${timeOf(result.at)} ngày ${dayOf(result.at)}`
        stamp(paper, 'Đã ký số', `${timeOf(result.at)} ${dayOf(result.at)}`)
        $('#step').replaceChildren(h('div', { class: 'ky-step' },
          h('p', { class: 'gd-note tone-ok' }, icon('check', 15), `Đã ký ${result.signed} tệp lúc ${timeOf(result.at)} ngày ${dayOf(result.at)}. Phiếu xác nhận đã gắn vào hồ sơ.`),
          h('span', { class: 'gd-sub' }, 'Mã xác thực, để người nhận kiểm tra ở trang Xác thực chữ ký của cơ quan:'),
          h('ul', { class: 'ks-codes' }, (result.files || []).map((f) => h('li', {}, h('span', { class: 'ks-file-name' }, f.name), h('span', { class: 'ks-code', 'aria-label': `Mã ${f.code}` }, grouped(f.code))))),
          h('div', { class: 'ks-actions' }, h('button', { type: 'button', onclick: () => desktiny.close(result) }, 'Xong'))))
        $('#step').querySelector('.ks-actions button').focus()
        desktiny.toast(`Đã ký ${result.signed} tệp.`)
      }

      async function start() {
        $('#paper').replaceChildren(skeleton(4, 16))
        try {
          me = me || (await pinBox($('#setup'), (who) => { me = who; start() }))
          if (!me) {
            $('#paper').replaceChildren()
            $('#steps').hidden = true
            return
          }
          $('#steps').hidden = false
          data = await server(`/api/ho-so/${caseId}`)
          if (!data.files.length) {
            $('#paper').replaceChildren(h('p', { class: 'gd-note' }, icon('file', 15), 'Hồ sơ chưa có tài liệu nào để ký.'))
            return
          }
          files = fileList(data.files, data.signatures)
          const last = data.signatures.at(-1)
          paper = sheet({ code: data.case.code, title: data.case.title, when: last ? `Lần ký gần nhất: ${dayOf(last.signed_at)}, ${last.signer_name}` : 'Chưa ký lần nào', files })
          $('#paper').replaceChildren(paper)
          if (me.locked) {
            $('#step').replaceChildren(h('p', { class: 'gd-note tone-bad', style: 'margin-top:14px' }, icon('lock', 15), 'PIN của bạn bị khoá sau 5 lần nhập sai. Nhờ quản trị đặt lại rồi đặt PIN mới.'))
            return
          }
          choose()
        } catch (error) {
          $('#paper').replaceChildren(h('p', { class: 'gd-note tone-bad', role: 'alert' }, icon('alert', 15), error.message))
        }
      }
      start()
    </script>
  </body>
</html>
