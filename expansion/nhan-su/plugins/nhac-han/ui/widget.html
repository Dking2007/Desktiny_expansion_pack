<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hồ sơ sắp hết hạn</title>
    <link rel="stylesheet" href="chung.css" />
  </head>
  <body>
    <table><tbody id="rows"><tr><td class="muted">Đang tải…</td></tr></tbody></table>
    <script type="module">
      import { $, desktiny, h, server } from './mo-rong.js'
      const label = (left) => (left < 0 ? `quá ${-left} ngày` : left === 0 ? 'hôm nay' : `còn ${left} ngày`)
      server('/api/sap-het-han?ngay=30')
        .then((data) => {
          $('#rows').replaceChildren(...(data.items.length ? data.items.slice(0, 8).map((r) =>
            h('tr', {}, h('td', {}, h('a', { href: '#', onclick: (e) => { e.preventDefault(); desktiny.navigate(`/cases/${r.case_id}`) } }, `${r.code} ${r.title}`)),
              h('td', { class: 'num ' + (r.left <= 7 ? 'bad' : '') }, label(r.left)))) : [h('tr', {}, h('td', { class: 'muted' }, 'Không có hồ sơ nào sắp hết hạn trong 30 ngày.'))]))
        })
        .catch((error) => $('#rows').replaceChildren(h('tr', {}, h('td', { class: 'bad' }, error.message))))
    </script>
  </body>
</html>
