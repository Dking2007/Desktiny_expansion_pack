<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nhắc hạn hồ sơ</title>
    <link rel="stylesheet" href="chung.css" />
  </head>
  <body>
    <h1>Nhắc hạn hồ sơ</h1>
    <p class="muted">Plugin đọc hồ sơ của các quy trình được chọn khi duyệt (Quản trị › Plugin › Quyền). Trường ngày, mốc nhắc và chu kỳ quét đặt ở Cấu hình.</p>
    <p id="info" class="muted"></p>
    <div class="row"><button id="scan" type="button">Quét ngay</button><span id="status" aria-live="polite"></span></div>
    <h2>Hết hạn trong 90 ngày tới</h2>
    <table>
      <thead><tr><th>Hồ sơ</th><th>Người tạo</th><th>Hết hạn</th><th class="num">Còn lại</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <script type="module">
      import { $, desktiny, h, server, show } from './mo-rong.js'
      async function load() {
        const data = await server('/api/quan-tri?ngay=90')
        $('#info').textContent = `Đang theo dõi ${data.watched} hồ sơ có trường “${data.settings.truong_ngay_het_han}”. Lần quét gần nhất: ${data.last_round ? new Date(data.last_round).toLocaleString('vi-VN') : 'chưa quét'}.`
        $('#rows').replaceChildren(...data.items.map((r) => h('tr', {},
          h('td', {}, h('a', { href: '#', onclick: (e) => { e.preventDefault(); desktiny.navigate(`/cases/${r.case_id}`) } }, `${r.code} ${r.title}`)),
          h('td', {}, r.owner_name || '—'), h('td', {}, r.expires), h('td', { class: 'num ' + (r.left <= 7 ? 'bad' : '') }, r.left))))
      }
      $('#scan').addEventListener('click', async () => {
        try {
          const result = await server('/api/quan-tri/quet', { method: 'POST', body: {} })
          show($('#status'), `Đã đọc ${result.read} hồ sơ, gửi ${result.reminded} nhắc nhở.`, 'ok')
          load()
        } catch (error) {
          show($('#status'), error.message, 'bad')
        }
      })
      load().catch((error) => show($('#status'), error.message, 'bad'))
    </script>
  </body>
</html>
