[project]
name = "desktiny-expansion-pack"
version = "1.1.0"
description = "Gói giao diện và plugin mở rộng cho Desktiny: nhân sự doanh nghiệp, một cửa cấp xã."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["mo_rong", "desktiny_plugin"]
