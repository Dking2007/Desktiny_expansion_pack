<!-- chú thích -->
<rect x="20" y="660" width="1080" height="44" rx="10" fill="#fff" stroke="#CBD5E1"/>
<text x="40" y="688" class="cap"><tspan class="b">Đóng gói:</tspan> kiểm mọi manifest theo quy tắc Desktiny dùng khi tải lên; có lỗi thì báo tệp nào, không ghi gì.</text>
<text x="40" y="688" class="cap s2"><tspan class="b">Cài:</tspan> quản trị viên tải .zip lên, xem trước, duyệt quyền; plugin kết nối nhận token và khoá ký.</text>
<text x="40" y="688" class="cap s3"><tspan class="b">Máy chủ plugin:</tspan> giải nén, chép token và khoá ký vào deploy/.env, chạy docker compose up.</text>
<text x="40" y="688" class="cap s4"><tspan class="b">Bên ngoài:</tspan> người dân nộp ở /cong/, thiết bị gửi số đo kèm khoá riêng; không ai gọi thẳng Desktiny.</text>
<text x="40" y="688" class="cap s5"><tspan class="b">Sự kiện của plugin:</tspan> plugin gửi sự kiện bằng token cài đặt, luồng tự động của Desktiny bắt đầu.</text>
<text x="40" y="688" class="cap s6"><tspan class="b">Desktiny gọi plugin:</tspan> sự kiện ký HMAC; plugin gọi lại API trong phạm vi đã duyệt.</text>
<text x="40" y="688" class="tinh"><tspan class="b">Đọc từ trên xuống:</tspan> đóng gói thành .zip, cài và duyệt quyền, rồi Desktiny và máy chủ plugin chạy cùng nhau.</text>

