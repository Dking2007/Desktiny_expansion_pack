<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" width="1120" height="770" role="img" aria-labelledby="tt dd">
<title id="tt">Vòng đời một bản mở rộng Desktiny: đóng gói, cài, chạy</title>
<desc id="dd">Phần 1, đóng gói và cài: mã nguồn trong expansion/ được đóng gói bằng build.bat hoặc scripts/dong_goi.py, bước này kiểm mọi manifest; kết quả là các tệp .zip trong dist/: gói giao diện goi-*.zip, plugin plugin-*.zip và may-chu-plugin-*.zip. Quản trị viên tải .zip lên Desktiny, xem trước, duyệt quyền; Desktiny hiện token và khoá ký đúng một lần, quản trị viên chép vào deploy/.env. Phần 2, đang chạy: Desktiny có gói giao diện, plugin đóng gói trong khung sandbox, outbox gửi sự kiện ký HMAC, bước quy trình plugin_action, API plugin với token có phạm vi, luồng tự động nhận sự kiện của plugin. Máy chủ plugin chạy bằng Docker Compose, chín plugin kết nối ở cổng 9201 đến 9209, mỗi plugin một volume SQLite. Bên ngoài: người dân nộp ở /cong/ của plugin Tiếp nhận trực tuyến; thiết bị gửi số đo tới /api/so-do của plugin Cảm biến kèm khoá thiết bị.</desc>
