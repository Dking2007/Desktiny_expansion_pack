<!-- chú thích -->
<rect x="20" y="688" width="1080" height="44" rx="10" fill="#fff" stroke="#CBD5E1"/>
<text x="40" y="716" class="cap"><tspan class="b">Số đo:</tspan> thiết bị gửi kèm khoá riêng; plugin lưu số đo vào SQLite và so với ngưỡng.</text>
<text x="40" y="716" class="cap s2"><tspan class="b">Vượt ngưỡng:</tspan> số đo đầu tiên mở sự cố, đúng một sự kiện, ghi vào hàng đợi trước khi gửi.</text>
<text x="40" y="716" class="cap s3"><tspan class="b">Desktiny tạm dừng:</tspan> sự kiện nằm lại trong hàng đợi, thử lại mỗi phút, gửi lại không thành hai sự kiện.</text>
<text x="40" y="716" class="cap s4"><tspan class="b">Desktiny nhận sự kiện:</tspan> luồng tự động tạo hồ sơ sự cố dạng nháp, điền sẵn thiết bị, số đo, ngưỡng.</text>
<text x="40" y="716" class="cap s5"><tspan class="b">Giao việc:</tspan> chủ luồng bấm Trình (bản sửa sau 3.1.0); bước Khắc phục hỏi đúng người phụ trách.</text>
<text x="40" y="716" class="cap s6"><tspan class="b">Lưu trữ:</tspan> hồ sơ kết thúc, plugin đọc hồ sơ, che dữ liệu cá nhân, ghi một dòng JSONL nối sha256.</text>
<text x="40" y="716" class="tinh"><tspan class="b">Đọc từ trái sang phải:</tspan> số đo → ngưỡng → hàng đợi → hồ sơ sự cố; hồ sơ kết thúc → tệp lưu trữ nối chuỗi.</text>

