<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" width="1120" height="790" role="img" aria-labelledby="tt dd">
<title id="tt">Cảm biến vượt ngưỡng thành hồ sơ sự cố; hồ sơ kết thúc vào tệp lưu trữ</title>
<desc id="dd">Phần trên, bản mở rộng Vận hành: thiết bị lo-say-1 gửi POST /api/so-do kèm X-Device-Key tới plugin Cảm biến ở cổng 9208; plugin chỉ giữ mã băm SHA-256 của khoá, lưu số đo vào SQLite và so với ngưỡng nhiet_do lớn hơn 80. Số đo mẫu 65, 70, 92, 95, 93, 66, 64: số đo 92 mở sự cố và tạo đúng một sự kiện, các số đo vượt tiếp theo không gửi thêm, số đo 66 đóng sự cố. Sự kiện được ghi vào hàng đợi SQLite trước khi gửi; khi Desktiny tạm dừng, plugin thử lại mỗi phút với cùng Idempotency-Key. Desktiny nhận sự kiện canh_bao_cam_bien, luồng tự động tạo hồ sơ sự cố dạng nháp, chủ luồng xem lại và trình, bước Khắc phục giao cho người phụ trách, trưởng bộ phận xác nhận. Phần dưới, bản mở rộng Quản trị dữ liệu: khi hồ sơ được duyệt hoặc kết thúc, Desktiny gửi sự kiện ký HMAC tới plugin Lưu trữ lịch sử ở cổng 9209; plugin đọc hồ sơ bằng quyền cases.read, che số CCCD, số điện thoại, email, rồi ghi một dòng vào archive/YYYY-MM.jsonl; mỗi dòng có sha256 của nội dung và prev là sha256 của dòng trước.</desc>
